<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-label="发布流程示意">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#4a7ba6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" rx="16" fill="url(#bg)"/>
  <text x="320" y="120" text-anchor="middle" font-family="sans-serif" font-size="40" fill="#ffffff">你好，世界 🌍</text>
  <text x="320" y="180" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#cfe3f5">Obsidian 写作 → git push → 自动发布</text>
  <text x="320" y="230" text-anchor="middle" font-family="monospace" font-size="16" fill="#9fd0a0">posts/*.md → pandoc → https://cqipc3.github.io/</text>
</svg>
